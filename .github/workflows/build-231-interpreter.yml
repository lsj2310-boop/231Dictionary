name: Build 231 Interpreter APK
on:
  push:
    branches: [231-interpreter-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMGR="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using Android SDK manager: $SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/231Interpreter-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 231Interpreter-APK
          path: output/231Interpreter-v1.1.apk
          retention-days: 30
      - name: Publish installable APK as GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "231-interpreter-v1.1" output/231Interpreter-v1.1.apk \
            --target "$GITHUB_SHA" \
            --title "231통역기 Android v1.1 Gemini Live" \
            --notes "Gemini 3.5 Transcribe Live streaming speech captions, Gemini 3.5 Flash-Lite translation, on-device ML Kit interim translation, user-supplied encrypted Gemini API key, no login, no AI glasses. Requires internet; model access and Google API costs may apply." \
            --prerelease
