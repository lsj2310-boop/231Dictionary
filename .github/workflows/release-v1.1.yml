name: Build and publish 231Dictionary v1.1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Verify sources
        run: |
          go test ./...
          go vet ./...
      - name: Build 64-bit Windows GUI installer
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w -H windowsgui' -o 231Dictionary_Installer_v1.1.exe .
          python3 add_pe_version.py 231Dictionary_Installer_v1.1.exe
      - name: Verify installer checksum matches tested v1.1 artifact
        run: |
          echo '38070cfd0359755250125fbe3176760d464f437561d1cea6e34ff442b3b20f54  231Dictionary_Installer_v1.1.exe' | sha256sum -c -
      - name: Package ZIP
        run: |
          mkdir -p dist
          cp 231Dictionary_Installer_v1.1.exe README_English.md LICENSE_231Dictionary_English.txt LICENSE_MIT_MouseTooltipTranslator.txt dist/
          (cd dist && zip -9 -q ../231Dictionary_v1.1_Installer.zip 231Dictionary_Installer_v1.1.exe README_English.md LICENSE_231Dictionary_English.txt LICENSE_MIT_MouseTooltipTranslator.txt)
          unzip -t 231Dictionary_v1.1_Installer.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1 231Dictionary_Installer_v1.1.exe 231Dictionary_v1.1_Installer.zip --target "$GITHUB_SHA" --title '231Dictionary v1.1' --notes-file RELEASE_NOTES_v1.1.md --latest
