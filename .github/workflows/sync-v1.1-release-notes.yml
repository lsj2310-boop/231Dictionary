name: Sync v1.1 release description
on:
  push:
    branches: [main]
    paths:
      - 'RELEASE_NOTES_v1.1.md'
      - '.github/workflows/sync-v1.1-release-notes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-release-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the published v1.1 release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.1 --notes-file RELEASE_NOTES_v1.1.md
