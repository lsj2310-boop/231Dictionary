name: Package 231Dictionary v1.0 ZIP
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-v1.0-zip.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release documentation
        uses: actions/checkout@v4
      - name: Retrieve the official v1.0 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download v1.0 --pattern '231Dictionary_Installer_v1.0.exe' --dir release
          echo 'a9e082a78d684758500bfa84b7274ec1b953a62de105201e86321cbe909712b2  release/231Dictionary_Installer_v1.0.exe' | sha256sum -c -
      - name: Create ZIP with installer and notices
        run: |
          cp README.md release/README_English.md
          cp LICENSE release/LICENSE_231Dictionary_English.txt
          cp LICENSE_MIT_MouseTooltipTranslator.txt release/
          (cd release && zip -9 -q ../231Dictionary_v1.0_Installer.zip 231Dictionary_Installer_v1.0.exe README_English.md LICENSE_231Dictionary_English.txt LICENSE_MIT_MouseTooltipTranslator.txt)
          unzip -t 231Dictionary_v1.0_Installer.zip
      - name: Attach ZIP to v1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0 ./231Dictionary_v1.0_Installer.zip --clobber
