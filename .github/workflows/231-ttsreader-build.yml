name: Build 231 TTSReader APK
on:
  push:
    branches:
      - 231-ttsreader-build
    paths:
      - 'ttsreader_build/**'
      - '.github/workflows/231-ttsreader-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Expand independent Android app sources
        run: |
          base64 --decode ttsreader_build/source.zip.base64 > /tmp/ttsreader-source.zip
          unzip -o -q /tmp/ttsreader-source.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compatibility fix for public Android TTS API
        run: |
          sed -i 's/engine = tts.getCurrentEngine();/engine = chosen.isEmpty() ? tts.getDefaultEngine() : chosen;/' app/src/main/java/com/reader231/tts/SpeechService.java
      - name: Build installation APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish APK for direct download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/231TTSReader_v1.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/231TTSReader_v1.2.apk
          git commit -m "Publish 231 TTSReader v1.1 Android APK" || true
          git push origin HEAD:231-ttsreader-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 231-TTSReader-v1.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
