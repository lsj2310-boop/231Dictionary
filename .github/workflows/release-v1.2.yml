name: Build and publish 231Dictionary v1.2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Verify source
        run: |
          go test ./...
          go vet ./...
      - name: Build 64-bit Windows GUI installer
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w -H windowsgui' -o 231Dictionary_Installer_v1.2.exe .
          python3 add_pe_version.py 231Dictionary_Installer_v1.2.exe
      - name: Verify installer against tested binary
        run: |
          echo '11bbd89e10c3027359a8d9b87d1e53d0c498eac0a5bafa6c14c65876a257a800  231Dictionary_Installer_v1.2.exe' | sha256sum -c -
      - name: Package ZIP installer
        run: |
          mkdir -p dist
          cp 231Dictionary_Installer_v1.2.exe README_English.md LICENSE_231Dictionary_English.txt LICENSE_MIT_MouseTooltipTranslator.txt dist/
          cp 231Dictionary_v1.2_설치사용설명서.md dist/
          (cd dist && zip -9 -q ../231Dictionary_v1.2_Installer.zip 231Dictionary_Installer_v1.2.exe README_English.md LICENSE_231Dictionary_English.txt LICENSE_MIT_MouseTooltipTranslator.txt 231Dictionary_v1.2_설치사용설명서.md)
          unzip -t 231Dictionary_v1.2_Installer.zip
      - name: Publish v1.2 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2 231Dictionary_Installer_v1.2.exe 231Dictionary_v1.2_Installer.zip --target "$GITHUB_SHA" --title '231Dictionary v1.2' --notes-file RELEASE_NOTES_v1.2.md --latest
